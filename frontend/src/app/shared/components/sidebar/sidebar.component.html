<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
    </div>
    <div class="brand-info" *ngIf="!isCollapsed">
      <div class="brand-title">J20 POS</div>
      <div class="brand-subtitle">Retail Management</div>
    </div>
    <button class="toggle-btn" (click)="onToggle()" title="Toggle Sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path *ngIf="!isCollapsed" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        <path *ngIf="isCollapsed" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Store Indicator -->
  <div class="store-badge" *ngIf="!isCollapsed">
    <div class="store-dot"></div>
    <div class="store-text">
      <span class="store-name">Store #102 - Bangalore</span>
      <span class="store-counter">Terminal 01</span>
    </div>
  </div>

  <!-- Navigation Menu: 8 Modules -->
  <nav class="sidebar-nav">
    <div class="nav-section-title" *ngIf="!isCollapsed">MAIN MENU</div>
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item">
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-link" [title]="item.label">
          <span class="nav-icon">
            <!-- 1. Dashboard Icon -->
            <svg *ngIf="item.icon === 'dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9" rx="1"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1"></rect>
              <rect x="3" y="16" width="7" height="5" rx="1"></rect>
            </svg>

            <!-- 2. Products Icon -->
            <svg *ngIf="item.icon === 'products'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>

            <!-- 3. Inventory Icon -->
            <svg *ngIf="item.icon === 'inventory'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>

            <!-- 4. POS Billing Icon -->
            <svg *ngIf="item.icon === 'pos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
              <line x1="7" y1="7" x2="17" y2="7"></line>
            </svg>

            <!-- 5. Sales History Icon -->
            <svg *ngIf="item.icon === 'sales-history'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>

            <!-- 6. Payments Icon -->
            <svg *ngIf="item.icon === 'payments'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>

            <!-- 7. Reports Icon -->
            <svg *ngIf="item.icon === 'reports'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>

            <!-- 8. Settings Icon -->
            <svg *ngIf="item.icon === 'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </span>
          <span class="nav-text" *ngIf="!isCollapsed">{{ item.label }}</span>
          <span *ngIf="item.badge && !isCollapsed" class="nav-badge" [ngClass]="{
            'badge-warning': item.badgeType === 'warning',
            'badge-primary': item.badgeType === 'primary'
          }">
            {{ item.badge }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer: Backend & Shift Status -->
  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="status-card">
      <div class="status-header">
        <span class="status-indicator"></span>
        <span class="status-title">System Status</span>
      </div>
      <div class="status-detail">Oracle 21c XE: <span class="text-success">Connected</span></div>
      <div class="status-detail">Shift: <span class="fw-600">Morning #14</span></div>
    </div>
  </div>
</aside>
