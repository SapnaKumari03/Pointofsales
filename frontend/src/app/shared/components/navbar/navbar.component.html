<header class="top-navbar">
  <!-- Left Side: Mobile toggle + Search Bar -->
  <div class="navbar-left">
    <button class="menu-toggle" (click)="onToggleSidebar()" title="Toggle Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <form class="search-form" (submit)="onSearch($event)">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          placeholder="Scan barcode or search product (F2 / Ctrl+K)..." 
          [(ngModel)]="searchQuery" 
          name="searchQuery"
          class="search-input"
        />
        <span class="search-shortcut">⌘K</span>
      </div>
    </form>
  </div>

  <!-- Center: Store Timing & Date -->
  <div class="navbar-center">
    <div class="date-chip">
      <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>{{ todayDate | date:'fullDate' }}</span>
    </div>
  </div>

  <!-- Right Side: Cash Status + Notification + Profile -->
  <div class="navbar-right">
    <!-- Active Cash Drawer Pill -->
    <div class="cash-pill" routerLink="/payments" style="cursor: pointer;" title="Current Cash in Drawer - Click to manage">
      <span class="cash-dot"></span>
      <span class="cash-label">Cash in Drawer:</span>
      <span class="cash-amount">₹31,250</span>
    </div>

    <!-- Notifications Bell Dropdown -->
    <div class="dropdown-wrapper">
      <button class="icon-btn" (click)="toggleNotifications()" title="Alerts & Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="badge-dot">3</span>
      </button>

      <div class="dropdown-menu notifications-menu" *ngIf="notificationsOpen">
        <div class="dropdown-header">
          <span class="dropdown-title">System Notifications</span>
          <span class="badge badge-warning">3 New</span>
        </div>
        <div class="dropdown-list">
          <div *ngFor="let n of notifications" class="notification-item" [class.urgent]="n.urgent">
            <div class="notification-content">
              <div class="notification-title">{{ n.title }}</div>
              <div class="notification-desc">{{ n.desc }}</div>
              <div class="notification-time">{{ n.time }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="dropdown-wrapper">
      <div class="profile-card" (click)="toggleProfile()">
        <div class="avatar">S</div>
        <div class="profile-info">
          <div class="profile-name">Sapna</div>
          <div class="role-badge">Store Manager</div>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <div class="dropdown-menu profile-menu" *ngIf="profileOpen">
        <div class="dropdown-header">
          <div class="profile-heading-name">Sapna</div>
          <div class="profile-email">sapna.manager@j20retail.in</div>
        </div>
        <div class="profile-links">
          <a class="profile-link">
            <span>Terminal Settings</span>
          </a>
          <a class="profile-link">
            <span>Cash Drawer Float</span>
          </a>
          <div class="divider"></div>
          <a class="profile-link text-danger">
            <span>Lock POS Terminal</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
